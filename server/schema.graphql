enum QuestionType {
  TEXT
  MULTIPLE_CHOICE
  CHECKBOX
  DATE
}

type Form {
  id: ID!
  title: String!
  description: String
  questions: [Question!]!
}

type Question {
  id: ID!
  title: String!
  type: QuestionType!
  options: [String!]!
}

type Response {
  id: ID!
  formId: ID!
  answers: [Answer!]!
}

type Answer {
  questionId: ID!
  values: [String!]!
}

input QuestionInput {
  title: String!
  type: QuestionType!
  options: [String!]! = []
}

input AnswerInput {
  questionId: ID!
  values: [String!]!
}

type Query {
  forms: [Form!]!
  form(id: ID!): Form
  responses(formId: ID!): [Response!]!
}

type Mutation {
  createForm(
    title: String!
    description: String
    questions: [QuestionInput!]!
  ): Form!
  submitResponse(formId: ID!, answers: [AnswerInput!]!): Response!
}
